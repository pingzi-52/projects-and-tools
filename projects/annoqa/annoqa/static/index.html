<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AnnoQA · 标注规范问答助手</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #121a30;
    --panel2: #16203a;
    --line: #24304f;
    --ink: #e8eefc;
    --dim: #8b9ac0;
    --accent: #4d8dff;
    --accent2: #7fe3ff;
    --ok: #3ddc97;
    --warn: #ffb454;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px; -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; height: 100vh; max-width: 1400px; margin: 0 auto; }

  /* ---------- 侧栏 ---------- */
  aside {
    width: 300px; flex-shrink: 0; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; background: #0d1425;
  }
  aside header {
    padding: 18px 18px 14px; border-bottom: 1px solid var(--line);
  }
  aside h1 {
    margin: 0 0 4px; font-size: 17px; letter-spacing: .02em;
  }
  aside h1 span { color: var(--accent); }
  aside .sub { font-size: 11.5px; color: var(--dim); }
  .status {
    margin-top: 10px; display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; padding: 4px 9px; border-radius: 999px;
    background: rgba(61,220,151,.1); color: var(--ok);
  }
  .status.warn { background: rgba(255,180,84,.12); color: var(--warn); }
  .status i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .docs { flex: 1; overflow-y: auto; padding: 14px; }
  .docs .label {
    font-size: 11px; color: var(--dim); letter-spacing: .12em; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .doc {
    padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); margin-bottom: 7px; font-size: 12.5px;
  }
  .doc .n { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .doc.empty { color: var(--dim); text-align: center; border-style: dashed; }

  aside footer { padding: 12px 14px; border-top: 1px solid var(--line); }
  aside footer button {
    width: 100%; padding: 8px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--dim);
    font-size: 12px; transition: .18s;
  }
  aside footer button:hover { border-color: #ff5f6d; color: #ff8a95; }

  /* ---------- 主区 ---------- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat {
    flex: 1; overflow-y: auto; padding: 26px 34px 10px; display: flex;
    flex-direction: column; gap: 20px;
  }
  .msg { display: flex; gap: 12px; max-width: 820px; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
  }
  .msg.bot .avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #061021; }
  .msg.user .avatar { background: var(--panel2); color: var(--dim); }
  .bubble {
    padding: 13px 16px; border-radius: 12px; line-height: 1.68; font-size: 13.5px;
    border: 1px solid var(--line); background: var(--panel); white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble { background: #1c2a4d; border-color: #2b3d68; }
  .bubble .mode {
    display: inline-block; font-size: 10.5px; letter-spacing: .1em; padding: 2px 7px;
    border-radius: 4px; margin-bottom: 8px; color: var(--accent2);
    background: rgba(127,227,255,.1); border: 1px solid rgba(127,227,255,.22);
  }
  .cites { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 9px; }
  .cites .t { font-size: 11px; color: var(--dim); margin-bottom: 6px; letter-spacing: .08em; }
  .cite {
    font-size: 11.5px; color: var(--dim); padding: 6px 9px; margin-bottom: 5px;
    background: var(--panel2); border-radius: 6px; border-left: 2px solid var(--accent);
    line-height: 1.55;
  }
  .cite b { color: var(--accent2); font-weight: 600; }
  .cite .score { float: right; color: #6b7a9e; }

  .empty-state {
    margin: auto; text-align: center; color: var(--dim); max-width: 460px;
  }
  .empty-state h2 { font-size: 16px; color: var(--ink); margin: 0 0 8px; font-weight: 600; }
  .empty-state p { font-size: 12.5px; line-height: 1.7; margin: 0 0 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    padding: 7px 13px; border-radius: 999px; cursor: pointer; font-size: 12px;
    background: var(--panel); border: 1px solid var(--line); color: var(--dim);
    transition: .16s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent2); }

  /* ---------- 输入框 ---------- */
  form {
    padding: 14px 34px 22px; display: flex; gap: 10px; align-items: flex-end;
  }
  textarea {
    flex: 1; resize: none; min-height: 48px; max-height: 160px; padding: 13px 16px;
    border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); font-family: inherit; font-size: 13.5px; line-height: 1.5;
    outline: none; transition: border-color .18s;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: #5b6a8f; }
  form button {
    height: 48px; padding: 0 26px; border-radius: 12px; cursor: pointer;
    border: none; font-size: 13.5px; font-weight: 600; color: #061021;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    transition: opacity .18s;
  }
  form button:disabled { opacity: .45; cursor: not-allowed; }

  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 2px 0; }
  .typing i {
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent2);
    animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% { opacity: .25 } 30% { opacity: 1 } }

  ::-webkit-scrollbar { width: 7px; }
  ::-webkit-scrollbar-thumb { background: #23304e; border-radius: 4px; }

  @media (max-width: 860px) {
    aside { display: none; }
    #chat { padding: 18px 16px 8px; }
    form { padding: 10px 16px 16px; }
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <header>
      <h1>Anno<span>QA</span></h1>
      <div class="sub">标注规范问答助手 · RAG</div>
      <div class="status" id="status"><i></i><span>连接中…</span></div>
    </header>
    <div class="docs">
      <div class="label"><span>知识库文档</span><span id="chunkCount"></span></div>
      <div id="docList"><div class="doc empty">加载中…</div></div>
    </div>
    <footer>
      <button id="clearBtn">清空知识库</button>
    </footer>
  </aside>

  <main>
    <div id="chat">
      <div class="empty-state" id="emptyState">
        <h2>问点关于标注规范的问题</h2>
        <p>工具会从已入库的规范文档中检索相关条款，给出答案并附上出处。未配置大模型时自动降级为原文检索模式。</p>
        <div class="chips">
          <div class="chip">3D 点云标注框的贴合误差怎么控制？</div>
          <div class="chip">遮挡超过多少算无效样本？</div>
          <div class="chip">抽检比例是多少？</div>
          <div class="chip">遇到规范没写的情况怎么办？</div>
        </div>
      </div>
    </div>
    <form id="askForm">
      <textarea id="question" placeholder="输入问题，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
      <button type="submit" id="sendBtn">提问</button>
    </form>
  </main>
</div>

<script>
(() => {
  'use strict';
  const chat = document.getElementById('chat');
  const emptyState = document.getElementById('emptyState');
  const form = document.getElementById('askForm');
  const input = document.getElementById('question');
  const sendBtn = document.getElementById('sendBtn');
  const docList = document.getElementById('docList');
  const chunkCount = document.getElementById('chunkCount');
  const statusEl = document.getElementById('status');
  let busy = false;

  async function api(path, options) {
    const res = await fetch(path, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    return data;
  }

  async function refresh() {
    try {
      const health = await api('/api/health');
      statusEl.className = 'status' + (health.llm_enabled ? '' : ' warn');
      statusEl.innerHTML = `<i></i><span>${health.llm_enabled ? 'LLM 已启用 · ' + health.llm_model : '检索模式（未配置 LLM）'}</span>`;

      const docs = await api('/api/documents');
      chunkCount.textContent = docs.chunks ? `${docs.chunks} 块` : '';
      if (!docs.documents.length) {
        docList.innerHTML = '<div class="doc empty">知识库为空<br>用 CLI 执行 ingest 入库</div>';
        return;
      }
      docList.innerHTML = docs.documents.map(d =>
        `<div class="doc">${escapeHtml(d.doc)}<div class="n">${d.chunks} 个分块</div></div>`
      ).join('');
    } catch (err) {
      statusEl.className = 'status warn';
      statusEl.innerHTML = `<i></i><span>连接失败</span>`;
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function scrollDown() {
    chat.scrollTop = chat.scrollHeight;
  }

  function addMessage(role, content) {
    if (emptyState && emptyState.parentNode) emptyState.remove();
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    wrap.innerHTML = `
      <div class="avatar">${role === 'bot' ? 'QA' : '我'}</div>
      <div class="bubble">${content}</div>`;
    chat.appendChild(wrap);
    scrollDown();
    return wrap.querySelector('.bubble');
  }

  function renderAnswer(bubble, data) {
    const modeLabel = data.mode === 'llm'
      ? `LLM 回答 · ${data.citations.length} 段引用`
      : `检索模式 · ${data.citations.length} 段相关原文`;
    let html = `<span class="mode">${modeLabel}</span>\n`;
    html += escapeHtml(data.answer);
    if (data.citations && data.citations.length) {
      html += `<div class="cites"><div class="t">引用来源</div>`;
      for (const c of data.citations) {
        const preview = c.text.length > 160 ? c.text.slice(0, 160) + '…' : c.text;
        html += `<div class="cite"><span class="score">${c.score.toFixed(3)}</span>
          <b>${escapeHtml(c.doc)}</b> · 片段 ${c.chunk_id}<br>${escapeHtml(preview)}</div>`;
      }
      html += `</div>`;
    }
    bubble.innerHTML = html;
  }

  async function ask(question) {
    if (busy || !question.trim()) return;
    busy = true;
    sendBtn.disabled = true;
    addMessage('user', escapeHtml(question));
    const bubble = addMessage('bot', '<span class="typing"><i></i><i></i><i></i></span>');

    try {
      const data = await api('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      renderAnswer(bubble, data);
    } catch (err) {
      bubble.innerHTML = `<span class="mode">出错</span>\n${escapeHtml(err.message)}`;
    } finally {
      busy = false;
      sendBtn.disabled = false;
      scrollDown();
    }
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const q = input.value;
    input.value = '';
    input.style.height = 'auto';
    ask(q);
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      input.value = chip.textContent;
      form.requestSubmit();
    });
  });

  document.getElementById('clearBtn').addEventListener('click', async () => {
    if (!confirm('确定清空知识库？')) return;
    try {
      await api('/api/documents', { method: 'DELETE' });
      await refresh();
    } catch (err) {
      alert('清空失败：' + err.message);
    }
  });

  refresh();
})();
</script>
</body>
</html>
