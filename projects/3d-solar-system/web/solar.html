<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #01020a; color: #fff;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;

  }
  #scene { position: fixed; inset: 0; display: block; cursor: crosshair; }
  .mono { font-family: "Courier New", ui-monospace, monospace; letter-spacing: 2px; }

  #hud { position: fixed; inset: 0; pointer-events: none; }

  .corner { position: absolute; width: 34px; height: 34px; border: 0 solid #00e5ff; opacity: .38; }
  .corner.tl { top: 30px; left: 30px; border-top-width: 2px; border-left-width: 2px; }
  .corner.tr { top: 30px; right: 30px; border-top-width: 2px; border-right-width: 2px; }
  .corner.bl { bottom: 30px; left: 30px; border-bottom-width: 2px; border-left-width: 2px; }
  .corner.br { bottom: 30px; right: 30px; border-bottom-width: 2px; border-right-width: 2px; }

<script type="module">
import * as THREE from "three";

// ===========================================================================
// 0. Deterministic RNG + texture helpers
// ===========================================================================
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  return { c, ctx: c.getContext("2d") };
}

function toTexture(canvas, repeat = 1) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.ClampToEdgeWrapping;
  t.repeat.set(repeat, 1);
  return t;
}

// Horizontal banding used by every gas giant / rocky body.
function bandedSurface(w, h, seed, palette, opts = {}) {
  const rnd = mulberry32(seed);
  const { c, ctx } = makeCanvas(w, h);
  const bands = opts.bands ?? 22;
  const wobble = opts.wobble ?? 1;

  // base
  const g = ctx.createLinearGradient(0, 0, 0, h);
  palette.forEach((col, i) => g.addColorStop(i / (palette.length - 1), col));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  // horizontal bands
  for (let i = 0; i < bands; i++) {
    const y = (i / bands) * h + (rnd() - 0.5) * (h / bands) * 0.9;
    const bh = (h / bands) * (0.25 + rnd() * 0.85);
    const col = palette[Math.floor(rnd() * palette.length)];
    ctx.globalAlpha = 0.10 + rnd() * 0.26;
    ctx.fillStyle = col;
    ctx.beginPath();
    // Wobble must fade to zero at the poles. A wavy band near y=0 or y=h wraps
    // around the pole in UV space and renders as concentric rings on the sphere.
    const poleTaper = Math.min(1, Math.min(y, h - y) / (h * 0.22));
    // Fix the phase per band. Re-rolling rnd() inside the x loop (the old code)
    // made the edge a high-frequency jitter rather than a smooth fluid wave.
    const p1 = rnd() * Math.PI * 2, p2 = rnd() * Math.PI * 2, p3 = rnd() * Math.PI * 2;
    const f1 = 1 + rnd() * 2.5, f2 = 3 + rnd() * 4, f3 = 7 + rnd() * 6;
    const amp = (0.8 + rnd() * 1.6) * wobble * poleTaper * (h / bands);
    const wave = (x) => {
      const u = x / w;
      return (Math.sin(u * Math.PI * 2 * f1 + p1) * 0.55
        + Math.sin(u * Math.PI * 2 * f2 + p2) * 0.30
        + Math.sin(u * Math.PI * 2 * f3 + p3) * 0.15) * amp;
    };
    ctx.moveTo(0, y + wave(0));
    for (let x = 0; x <= w; x += 8) ctx.lineTo(x, y + wave(x));
    for (let x = w; x >= 0; x -= 8) ctx.lineTo(x, y + bh + wave(x) * 0.7);
    ctx.closePath();
    ctx.fill();
  }

  // turbulent blobs
  const blobs = opts.blobs ?? 240;
  for (let i = 0; i < blobs; i++) {
    const x = rnd() * w, y = rnd() * h;
    const r = 4 + rnd() * (opts.blobSize ?? 34);
    // same pole problem as the bands: squash and dim blobs that reach the caps
    const poleTaper = Math.min(1, Math.min(y, h - y) / (h * 0.18));
    ctx.globalAlpha = (0.02 + rnd() * 0.08) * poleTaper;
    ctx.fillStyle = palette[Math.floor(rnd() * palette.length)];
    ctx.beginPath();
    ctx.ellipse(x, y, r * (1 + rnd()), r * (0.25 + rnd() * 0.4) * poleTaper, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Pole caps. Every feature above is horizontal, and on a sphere any horizontal
  // feature at v≈0 or v≈1 collapses into a ring around the pole, which reads as
  // a fingerprint swirl. Paint a smooth cap over each pole so there is no detail
  // left there to pinch.
  const capH = h * 0.11;
  for (const top of [true, false]) {
    const y0 = top ? 0 : h - capH;
    const g2 = ctx.createLinearGradient(0, y0, 0, y0 + capH);
    const edge = top ? palette[0] : palette[palette.length - 1];
    g2.addColorStop(0, edge);
    g2.addColorStop(0.45, edge);
    g2.addColorStop(1, "rgba(0,0,0,0)");
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = g2;
    ctx.fillRect(0, y0, w, capH);
  }

  ctx.globalAlpha = 1;
  return { c, ctx, rnd };
}

// Impact craters for airless bodies.
function craterSurface(w, h, seed, base, craters = 260) {
  const rnd = mulberry32(seed);
  const { c, ctx } = makeCanvas(w, h);
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, w, h);
  // mottling
  for (let i = 0; i < 900; i++) {
    ctx.globalAlpha = 0.02 + rnd() * 0.05;
    ctx.fillStyle = rnd() > 0.5 ? "#ffffff" : "#000000";
    const r = 6 + rnd() * 40;
    ctx.beginPath();
    ctx.arc(rnd() * w, rnd() * h, r, 0, Math.PI * 2);
    ctx.fill();
  }
  // craters
  for (let i = 0; i < craters; i++) {
    const x = rnd() * w, y = rnd() * h;
    const r = 1.5 + Math.pow(rnd(), 3) * 26;
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.24;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x - r * 0.22, y - r * 0.22, r * 0.72, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x, y, r * 1.16, 0, Math.PI * 2);
    ctx.arc(x, y, r * 0.96, 0, Math.PI * 2, true); ctx.fill();
  }
  ctx.globalAlpha = 1;
  return { c, ctx, rnd };
}

// Earth: ocean + continents + ice caps, plus a separate cloud layer.
// ---------------------------------------------------------------------------
// 3D value noise, sampled on the unit sphere so a texture is seamless in
// longitude and has no polar pinching (a 2D noise would show both).
// ---------------------------------------------------------------------------
function hash3(i, j, k) {
  let n = Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(k, 1442695041);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
const smoothstep01 = (t) => t * t * (3 - 2 * t);

function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const u = smoothstep01(x - xi), v = smoothstep01(y - yi), w = smoothstep01(z - zi);
  const c000 = hash3(xi, yi, zi),         c100 = hash3(xi + 1, yi, zi);
  const c010 = hash3(xi, yi + 1, zi),     c110 = hash3(xi + 1, yi + 1, zi);
  const c001 = hash3(xi, yi, zi + 1),     c101 = hash3(xi + 1, yi, zi + 1);
  const c011 = hash3(xi, yi + 1, zi + 1), c111 = hash3(xi + 1, yi + 1, zi + 1);
  const x00 = c000 + (c100 - c000) * u, x10 = c010 + (c110 - c010) * u;
  const x01 = c001 + (c101 - c001) * u, x11 = c011 + (c111 - c011) * u;
  const y0 = x00 + (x10 - x00) * v, y1 = x01 + (x11 - x01) * v;
  return y0 + (y1 - y0) * w;
}

function fbm3(x, y, z, octaves = 5, lacunarity = 2.03, gain = 0.5) {
  let amp = 0.5, freq = 1, sum = 0, norm = 0;
  for (let o = 0; o < octaves; o++) {
    sum += noise3(x * freq, y * freq, z * freq) * amp;
    norm += amp;
    amp *= gain;
    freq *= lacunarity;
  }
  return sum / norm;
}

function smoothstep(edge0, edge1, x) {
  const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}
const mix = (a, b, t) => a + (b - a) * t;

// Earth: fractal continents carved out of an ocean, with latitude-driven
// biomes, coastal shallows, ice caps and a separate cloud layer.
function earthSurface(w, h, seed) {
  // The field is evaluated at half resolution and upscaled: 4x fewer noise
  // samples for a texture that the sphere mapping blurs anyway.
  const lw = w >> 1, lh = h >> 1;
  const { c: lowC, ctx: lowCtx } = makeCanvas(lw, lh);
  const img = lowCtx.createImageData(lw, lh);
  const d = img.data;
  const S = 2.15;          // continent frequency
  const off = seed * 0.001;

  for (let y = 0; y < lh; y++) {
    const lat = (0.5 - (y + 0.5) / lh) * Math.PI;   // +pi/2 .. -pi/2
    const cl = Math.cos(lat), sl = Math.sin(lat);
    for (let x = 0; x < lw; x++) {
      const lon = ((x + 0.5) / lw) * Math.PI * 2;
      const px = cl * Math.cos(lon), py = sl, pz = cl * Math.sin(lon);

      // continents: two overlapping fields so coastlines meander instead of
      // looking like a single thresholded blob
      const cont = fbm3(px * S + off, py * S, pz * S, 5, 2.03, 0.52);
      const ridge = fbm3(px * S * 2.7 + 31.7, py * S * 2.7, pz * S * 2.7, 4, 2.11, 0.5);
      const e = cont * 0.78 + ridge * 0.22;

      const absLat = Math.abs(lat);
      let r, g, b;

      if (e > 0.505) {
        // ---- land
        const t = smoothstep(0.505, 0.78, e);          // 0 coast .. 1 highland
        const dry = fbm3(px * 6.1 - 12.4, py * 6.1, pz * 6.1, 3, 2.0, 0.5);

        // biome by latitude
        let base;
        if (absLat > 1.24) base = [236, 240, 244];            // polar ice
        else if (absLat > 1.02) base = [150, 156, 152];       // tundra
        else if (absLat > 0.82) base = [58, 84, 60];          // boreal
        else if (absLat > 0.36) base = dry > 0.56 ? [150, 132, 86] : [74, 106, 58];
        else base = dry > 0.60 ? [186, 158, 100] : [42, 92, 46]; // desert / jungle

        // mountains: rock, then snow above the treeline
        const rock = [112, 98, 82];
        const snow = [242, 246, 250];
        let col = [mix(base[0], rock[0], smoothstep(0.42, 0.86, t)),
                   mix(base[1], rock[1], smoothstep(0.42, 0.86, t)),
                   mix(base[2], rock[2], smoothstep(0.42, 0.86, t))];
        const snowAmt = smoothstep(0.80, 0.97, t) * (absLat > 0.5 ? 1 : 0.55);
        col = [mix(col[0], snow[0], snowAmt), mix(col[1], snow[1], snowAmt), mix(col[2], snow[2], snowAmt)];

        // coastal beach strip
        const beach = 1 - smoothstep(0.505, 0.535, e);
        col = [mix(col[0], 196, beach * 0.55), mix(col[1], 186, beach * 0.55), mix(col[2], 150, beach * 0.55)];

        // per-pixel grain so the surface is not flat-shaded mush
        const grain = (noise3(px * 90, py * 90, pz * 90) - 0.5) * 16;
        r = col[0] + grain; g = col[1] + grain; b = col[2] + grain;
      } else {
        // ---- ocean: depth ramps from coastal turquoise to abyssal navy
        const depth = smoothstep(0.505, 0.30, e);
        r = mix(28, 5, depth);
        g = mix(104, 26, depth);
        b = mix(146, 62, depth);
        // faint sea-floor texture so the open ocean is not a flat gradient
        const swirl = (noise3(px * 26, py * 26, pz * 26) - 0.5) * 10 * (1 - depth * 0.5);
        r += swirl; g += swirl * 1.1; b += swirl * 1.2;
      }

      const i4 = (y * lw + x) * 4;
      d[i4] = Math.max(0, Math.min(255, r));
      d[i4 + 1] = Math.max(0, Math.min(255, g));
      d[i4 + 2] = Math.max(0, Math.min(255, b));
      d[i4 + 3] = 255;
    }
  }
  lowCtx.putImageData(img, 0, 0);

  const { c, ctx } = makeCanvas(w, h);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(lowC, 0, 0, w, h);

  // ice caps drawn on top so they read as sheets rather than noise
  for (const [y0, y1] of [[0, h * 0.062], [h, h * 0.938]]) {
    const gg = ctx.createLinearGradient(0, y0, 0, y1);
    gg.addColorStop(0, "rgba(248,252,255,0.96)");
    gg.addColorStop(1, "rgba(248,252,255,0)");
    ctx.fillStyle = gg;
    ctx.fillRect(0, Math.min(y0, y1), w, Math.abs(y1 - y0));
  }

  return { c, ctx, rnd: mulberry32(seed) };
}

// Cloud layer: the same fractal field, thresholded into broken bands that
// follow the planet's circulation cells instead of scattered blobs.
function cloudSurface(w, h, seed) {
  const lw = w >> 1, lh = h >> 1;
  const { c: lowC, ctx: lowCtx } = makeCanvas(lw, lh);
  const img = lowCtx.createImageData(lw, lh);
  const d = img.data;
  const S = 3.1, off = seed * 0.01;

  for (let y = 0; y < lh; y++) {
    const lat = (0.5 - (y + 0.5) / lh) * Math.PI;
    const cl = Math.cos(lat), sl = Math.sin(lat);
    const absLat = Math.abs(lat);
    // Hadley cells: wet at the equator and ~60 deg, dry at ~30 deg
    const cell = 0.55 + 0.45 * Math.cos(absLat * 3.4);

    for (let x = 0; x < lw; x++) {
      const lon = ((x + 0.5) / lw) * Math.PI * 2;
      const px = cl * Math.cos(lon), py = sl, pz = cl * Math.sin(lon);

      // Stretch the noise along longitude to get the banded, sheared look.
      // The threshold is deliberately narrow: a wide one leaves most of the
      // sphere at partial alpha, which reads as a grey smear over the planet
      // rather than as distinct cloud tops.
      const n = fbm3(px * S * 0.62 + off, py * S * 2.2, pz * S * 0.62, 5, 2.07, 0.54);
      const wisp = fbm3(px * 9.4 - 3.1, py * 15.0, pz * 9.4, 3, 2.0, 0.5);

      let a = smoothstep(0.545, 0.635, n * 0.78 + wisp * 0.22) * cell;
      a = Math.min(1, a * 1.25);

      const i4 = (y * lw + x) * 4;
      d[i4] = 255; d[i4 + 1] = 255; d[i4 + 2] = 255;
      d[i4 + 3] = a * 255;
    }
  }
  lowCtx.putImageData(img, 0, 0);

  const { c, ctx } = makeCanvas(w, h);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(lowC, 0, 0, w, h);
  return c;
}

// Radial glow sprite (same technique as the first demo).
function radialTexture(stops) {
  const s = 256;
  const { c, ctx } = makeCanvas(s, s);
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  for (const [at, col] of stops) g.addColorStop(at, col);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const GLOW = radialTexture([
  [0, "rgba(255,255,255,1)"], [0.14, "rgba(255,255,255,0.62)"],
  [0.34, "rgba(255,255,255,0.24)"], [0.60, "rgba(255,255,255,0.07)"],

]);

// Limb-only halo: transparent through the middle, bright in a narrow band just
// outside the disc. A plain radial gradient is brightest at its centre, so
// using it as an atmosphere paints a haze straight over the planet.
const LIMB = (() => {
  const s = 256;
  const { c, ctx } = makeCanvas(s, s);
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0.00, "rgba(255,255,255,0)");
  g.addColorStop(0.30, "rgba(255,255,255,0)");
  g.addColorStop(0.42, "rgba(255,255,255,0.06)");
  g.addColorStop(0.47, "rgba(255,255,255,0.55)");
  g.addColorStop(0.52, "rgba(255,255,255,0.30)");
  g.addColorStop(0.66, "rgba(255,255,255,0.07)");
  g.addColorStop(1.00, "rgba(255,255,255,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

function glowSprite(color, size, opacity, order = 8, map = GLOW) {

  }));
  sp.scale.set(size, size, 1);

}

// distance & size compression so the whole system fits on screen
const dispDist = (a) => 6.0 * Math.pow(a, 0.60) + 1.9;
const dispRadius = (km) => 0.62 * Math.pow(km / 12742, 0.42);
// angular speed: compressed from real periods so the outer planets still move
const dispSpeed = (period) => 0.42 * Math.pow(365.25 / period, 0.42);

// The pure power curve squeezes the inner system hard: Venus and Earth are only
// 0.277 AU apart, which compressed to a 1.0 gap for two bodies whose radii sum
// to 1.23 — they overlapped on screen. Push each orbit out until every pair of
// neighbours keeps a visible gap, leaving the (already roomy) outer system as is.
const ORBIT_CLEARANCE = 0.75;
const orbitDists = (() => {
  const d = PLANETS.map((p) => dispDist(p.a));
  for (let i = 1; i < d.length; i++) {
    const need = dispRadius(PLANETS[i - 1].km) + dispRadius(PLANETS[i].km) + ORBIT_CLEARANCE;
    d[i] = Math.max(d[i], d[i - 1] + need);
  }
  return d;
})();

function makeRingTexture(seed, faint) {
  const w = 1024, h = 8;
  const { c, ctx } = makeCanvas(w, h);
  ctx.clearRect(0, 0, w, h);
  const rnd = mulberry32(seed);
  const stops = faint
    ? [[0, 0], [0.1, 0.25], [0.45, 0.10], [0.6, 0.35], [0.85, 0.12], [1, 0]]
    : [[0, 0], [0.04, 0.55], [0.30, 0.85], [0.45, 0.35], [0.52, 0.72], [0.68, 0.95], [0.80, 0.30], [0.88, 0.62], [1, 0]];
  for (const [x, a] of stops) {
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.fillRect(x * w, 0, 1, h);
  }
  // continuous fill by interpolating between stops
  const grad = ctx.createLinearGradient(0, 0, w, 0);
  for (const [x, a] of stops) grad.addColorStop(x, `rgba(255,255,255,${a})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
  // fine ringlets
  for (let i = 0; i < 220; i++) {
    const x = rnd() * w;
    ctx.fillStyle = `rgba(255,255,255,${rnd() * 0.22})`;
    ctx.fillRect(x, 0, 1 + rnd() * 3, h);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function addRing(planet, def) {
  const inner = planet.dispR * def.inner;
  const outer = planet.dispR * def.outer;
  const geo = new THREE.RingGeometry(inner, outer, 160, 1);
  // remap UVs radially so the 1-D texture maps across the ring
  const pos = geo.attributes.position;
  const uv = geo.attributes.uv;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const t = (v.length() - inner) / (outer - inner);
    uv.setXY(i, t, 0.5);
  }
  const mat = new THREE.MeshBasicMaterial({
    map: makeRingTexture(planet.key.length * 37 + 5, def.faint),
    color: def.faint ? 0x9fd8e0 : 0xe8d4a8,
    transparent: true, opacity: def.faint ? 0.22 : 0.72,
    side: THREE.DoubleSide, depthWrite: false,
    blending: THREE.NormalBlending,
  });
  const ring = new THREE.Mesh(geo, mat);
  ring.rotation.x = -Math.PI / 2;
  ring.renderOrder = 2;
  return ring;
}

  const op = new Float32Array((segs + 1) * 3);
  for (let s = 0; s <= segs; s++) {
    const a = (s / segs) * Math.PI * 2;
    op[s * 3] = Math.cos(a) * dist;
    op[s * 3 + 1] = 0;
    op[s * 3 + 2] = Math.sin(a) * dist;
  }
  const og = new THREE.BufferGeometry();
  og.setAttribute("position", new THREE.BufferAttribute(op, 3));
  const orbitLine = new THREE.Line(og, new THREE.LineBasicMaterial({
    color: p.color, transparent: true, opacity: 0.16,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  orbitGroup.add(orbitLine);

  // --- planet group (positioned along the orbit each frame)
  const g = new THREE.Group();
  orbitGroup.add(g);

  const mat = new THREE.MeshStandardMaterial({
    map: p.surface(), roughness: p.key === "earth" ? 0.82 : 0.94, metalness: 0.0,
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(dispR, 64, 48), mat);
  mesh.rotation.z = THREE.MathUtils.degToRad(p.tilt);
  g.add(mesh);

  if (p.clouds) {
    const cloudTex = p.clouds();
    const cloudMesh = new THREE.Mesh(
      new THREE.SphereGeometry(dispR * 1.015, 48, 32),
      new THREE.MeshStandardMaterial({
        map: cloudTex, transparent: true, opacity: 0.62,
        roughness: 1, metalness: 0, depthWrite: false,
      }),
    );
    cloudMesh.rotation.z = THREE.MathUtils.degToRad(p.tilt);
    g.add(cloudMesh);
  }

  if (p.ring) {
    const ring = addRing({ dispR, key: p.key }, p.ring);
    ring.rotation.z = THREE.MathUtils.degToRad(p.tilt);
    g.add(ring);
  }

  // Atmosphere halo — a limb-only ring. A sprite's world half-width is size/2,
  // and LIMB is brightest at 0.47 of that radius, so size must be
  // 2 * dispR / 0.47 to land the band exactly on the planet's edge.
  const atmo = glowSprite(p.color, dispR * 4.26, 0.85, 6, LIMB);
  g.add(atmo);

  // selection ring (hidden until focused); sits just outside the body, and
  // outside the ring system when the planet has one
  const selR = p.ring ? dispR * p.ring.outer * 1.08 : dispR * 1.34;
  const selRing = new THREE.Mesh(
    new THREE.RingGeometry(selR, selR * 1.03, 96, 1),
    new THREE.MeshBasicMaterial({
      color: 0x00e5ff, transparent: true, opacity: 0,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
    }),
  );
  selRing.rotation.x = -Math.PI / 2;
  g.add(selRing);

  // invisible hit sphere
  const hit = new THREE.Mesh(
    new THREE.SphereGeometry(Math.max(dispR * 2.4, 1.15), 16, 12),
    new THREE.MeshBasicMaterial({ visible: false }),
  );
  g.add(hit);

  // --- moons: a single close satellite, drawn to scale against its planet.
  // Only bodies flagged with moonSpec get one; the rest keep the bare count.
  let moon = null;
  if (p.moonSpec) {
    const m = p.moonSpec;
    const moonOrbit = new THREE.Group();
    moonOrbit.rotation.x = THREE.MathUtils.degToRad(m.inc || 0);
    g.add(moonOrbit);

    const moonR = dispR * m.ratio;
    const moonDist = dispR * m.dist;
    const moonMesh = new THREE.Mesh(
      new THREE.SphereGeometry(moonR, 32, 24),
      new THREE.MeshStandardMaterial({
        map: toTexture(craterSurface(512, 256, m.seed, m.base, 160).c),
        roughness: 1, metalness: 0,
      }),
    );
    // start the moon on the far side so it does not cover the planet at load
    moonMesh.position.set(-moonDist, 0, 0);
    moonOrbit.add(moonMesh);

    // faint orbit line so the satellite reads as orbiting, not drifting
    const mSeg = 96;
    const mPos = new Float32Array((mSeg + 1) * 3);
    for (let s = 0; s <= mSeg; s++) {
      const ang = (s / mSeg) * Math.PI * 2;
      mPos[s * 3] = Math.cos(ang) * moonDist;
      mPos[s * 3 + 1] = 0;
      mPos[s * 3 + 2] = Math.sin(ang) * moonDist;
    }
    const mGeo = new THREE.BufferGeometry();
    mGeo.setAttribute("position", new THREE.BufferAttribute(mPos, 3));
    moonOrbit.add(new THREE.Line(mGeo, new THREE.LineBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0.13,
      blending: THREE.AdditiveBlending, depthWrite: false,
    })));

    moon = { orbit: moonOrbit, mesh: moonMesh, dist: moonDist, speed: m.speed ?? 0.9 };
  }

  // label
  const el = document.createElement("div");
  el.className = "plabel mono";
  el.style.color = p.accent;
  el.innerHTML = `${p.cn}<span class="en">${p.en}</span>`;
  labelLayer.appendChild(el);

  const body = {
    kind: "planet", index: i, cn: p.cn, en: p.en, accent: p.accent,
    color: p.color, group: g, mesh, hit, orbitGroup, orbitLine,
    dist, dispR, period: p.period, rotH: p.rotH,
    speed: dispSpeed(p.period), angle: (i * 2.4) % (Math.PI * 2),
    label: el, selRing, hoverAt: -99, atmo, moon,
    ringOuter: p.ring ? p.ring.outer : 0,
    info: {
      cn: p.cn, en: p.en, accent: p.accent, desc: p.desc,
      rows: [
        ["直径", `${p.km.toLocaleString("en-US")} km`],
        ["轨道半长径", `${p.a.toFixed(2)} AU`],
        ["公转周期", p.period < 365
          ? `${p.period.toFixed(0)} 天`
          : `${(p.period / 365.25).toFixed(2)} 年`],
        ["自转周期", `${Math.abs(p.rotH).toFixed(1)} 小时${p.rotH < 0 ? "（逆向）" : ""}`],
        ["已知卫星", `${p.moons} 颗`],
        ["表面温度", p.temp],
      ],
    },
  };
  hit.userData.body = body;
  bodies.push(body);
  pickables.push(hit);
  p._body = body;
}

// ===========================================================================
// 6. Asteroid belt + Kuiper belt
// ===========================================================================
function makeBelt(count, rMin, rMax, ySpread, seed, size) {
  const rnd = mulberry32(seed);
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const tint = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const a = rnd() * Math.PI * 2;
    // cluster toward the middle of the band instead of spreading uniformly, so
    // the belt reads as a defined ring rather than a haze
    const t = (rnd() + rnd() + rnd()) / 3;
    const r = rMin + t * (rMax - rMin);
    pos[i * 3] = Math.cos(a) * r;
    pos[i * 3 + 1] = (rnd() + rnd() - 1) * ySpread;
    pos[i * 3 + 2] = Math.sin(a) * r;
    tint.setHSL(0.08 + rnd() * 0.06, 0.20 + rnd() * 0.20, 0.38 + rnd() * 0.30);
    col[i * 3] = tint.r; col[i * 3 + 1] = tint.g; col[i * 3 + 2] = tint.b;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({
    size, sizeAttenuation: true, vertexColors: true,
    transparent: true, opacity: 0.26, depthWrite: false,
    blending: THREE.AdditiveBlending,
  }));
}
const beltMarsJup = makeBelt(2200, dispDist(1.524) + 1.4, dispDist(5.203) - 3.2, 0.16, 12, 0.045);
const beltKuiper = makeBelt(3400, 48, 62, 1.2, 77, 0.085);
beltKuiper.material.opacity = 0.20;
scene.add(beltMarsJup, beltKuiper);

// ===========================================================================
// 7. Interaction state
// ===========================================================================
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(-10, -10);
let hovered = null;
let focused = null;
let paused = false;
let timeScale = 1;
let simTime = 0;
let years = 0;

const clock = new THREE.Clock();
let fpsAcc = 0, fpsFrames = 0;

const tmpV = new THREE.Vector3();

function setPointer(e) {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
}

// Current body under the pointer, or null. Shared by hover and click so both
// always agree about what is being pointed at.
function pickAt() {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  return hits.length ? hits[0].object.userData.body : null;
}
addEventListener("pointermove", setPointer);

let dragging = false;
let dragStart = { x: 0, y: 0, yaw: 0, pitch: 0 };
let downAt = null;

canvas.addEventListener("pointerdown", (e) => {
  setPointer(e);
  dragging = true;
  dragStart = { x: e.clientX, y: e.clientY, yaw: camState.targetYaw, pitch: camState.targetPitch };
  // snapshot the body under the cursor *now*: by the time the button is released
  // an orbiting planet may have already slipped out from under the pointer.
  // Falling back to `hovered` means "whatever was highlighted when I pressed".
  downAt = { x: e.clientX, y: e.clientY, t: performance.now(), body: pickAt() || hovered };
});
addEventListener("pointerup", (e) => {
  if (!dragging) return;
  dragging = false;
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  const dt = performance.now() - downAt.t;
  const pressed = downAt.body;
  downAt = null;
  if (moved < 6 && dt < 650) handleClick(pressed);
});
addEventListener("pointermove", (e) => {
  if (!dragging) return;
  camState.targetYaw = dragStart.yaw + (e.clientX - dragStart.x) * 0.005;
  camState.targetPitch = THREE.MathUtils.clamp(
    dragStart.pitch - (e.clientY - dragStart.y) * 0.004, 0.05, 1.45,
  );
});
addEventListener("wheel", (e) => {
  camState.targetRadius = THREE.MathUtils.clamp(
    camState.targetRadius * (1 + Math.sign(e.deltaY) * 0.09), 3.2, 320,
  );
}, { passive: true });

// ---- HUD refs
const infoEl = document.getElementById("info");
const flashEl = document.getElementById("flash");
const speedEl = document.querySelector("#speed b");
const clockEl = document.getElementById("clockv");
const fpsEl = document.getElementById("fps");

function showInfo(info) {
  infoEl.querySelector(".cn").textContent = info.cn;
  infoEl.querySelector(".en").textContent = info.en;
  infoEl.querySelector(".desc").textContent = info.desc;
  infoEl.querySelector(".cn").style.color = info.accent;
  const rows = infoEl.querySelector(".rows");
  rows.innerHTML = "";
  for (const [k, v] of info.rows) {
    const d = document.createElement("div");
    d.className = "row";
    d.innerHTML = `<span>${k}</span><b>${v}</b>`;
    rows.appendChild(d);
  }
  infoEl.classList.add("on");
}

function flashWord(text, color) {
  flashEl.querySelector(".w").textContent = text;
  flashEl.querySelector(".w").style.color = color;
  flashEl.style.transition = "none";
  flashEl.style.opacity = "1";
  flashEl.style.transform = "scale(1.04)";
  requestAnimationFrame(() => {
    flashEl.style.transition = "opacity 1.2s ease, transform 1.2s cubic-bezier(.16,1,.3,1)";
    flashEl.style.opacity = "0";
    flashEl.style.transform = "scale(1)";
  });
}

function selectBody(b) {
  focused = b;
  showInfo(b.info);
  flashWord(b.cn, b.accent);
  for (const x of bodies) {
    if (x.selRing) x.selRing.material.opacity = 0;
    if (x.label) x.label.classList.remove("sel");
  }
  if (b.selRing) b.selRing.material.opacity = 0.9;
  if (b.label) b.label.classList.add("sel");
  // Frame the body by the screen angle it should subtend, not by a fixed
  // multiple of its radius: Saturn is huge and needs far more stand-off than
  // Mercury to sit inside the frame at the same apparent size.
  const r = b.dispR || SUN_RADIUS;
  const fov = (camera.fov * Math.PI) / 180;
  const wantFraction = b.kind === "sun" ? 0.30 : 0.24; // of viewport height
  camState.targetRadius = Math.max(r / (wantFraction * Math.tan(fov / 2)), 2.2);
  // keep the dolly from ending inside the planet's own ring system
  if (b.ringOuter) camState.targetRadius = Math.max(camState.targetRadius, r * b.ringOuter * 1.35);

  // Swing round to the lit side. Focusing used to only change the radius, so the
  // camera kept whatever azimuth the user happened to be at — roughly half the
  // time that was the night side, and the planet rendered as a black disc with a
  // thin rim (Jupiter, Mercury and Saturn all showed this).
  if (b.kind === "planet") {
    b.group.getWorldPosition(tmpV);
    const toSun = tmpV.clone().negate().normalize(); // the sun sits at the origin
    const sunYaw = Math.atan2(toSun.x, toSun.z);
    const sunPitch = Math.acos(THREE.MathUtils.clamp(toSun.y, -1, 1));
    // stay ~28 deg off the sun line so a terminator stays in frame
    camState.targetYaw = sunYaw + 0.50;
    camState.targetPitch = THREE.MathUtils.clamp(sunPitch + 0.16, 0.12, 1.32);
  }
}

function clearFocus() {
  focused = null;
  infoEl.classList.remove("on");
  for (const x of bodies) {
    if (x.selRing) x.selRing.material.opacity = 0;
    if (x.label) x.label.classList.remove("sel");
  }
  camState.targetRadius = 96;
}

// The bodies orbit continuously, so a raycast taken on one frame can miss on the
// next. A click therefore counts if the pointer was over a body at press time OR
// is over one at release time — anything else is a deliberate click on empty space.
let lastClick = null;
function handleClick(pressedBody) {
  const released = pickAt();
  const b = released || pressedBody || hovered;
  lastClick = {
    pressed: pressedBody ? (pressedBody.kind === "sun" ? "sun" : pressedBody.index) : null,
    released: released ? (released.kind === "sun" ? "sun" : released.index) : null,
    used: b ? (b.kind === "sun" ? "sun" : b.index) : null,
  };
  if (b) selectBody(b);
  else clearFocus();
}

addEventListener("keydown", (e) => {
  if (e.code === "Escape") clearFocus();
  if (e.code === "Space") { e.preventDefault(); togglePause(); }
  const n = Number(e.key);
  if (n >= 1 && n <= 3) setSpeed([1, 4, 16][n - 1]);
});

function togglePause() {
  paused = !paused;
  document.getElementById("btnPause").classList.toggle("on", paused);
  document.getElementById("btnPause").textContent = paused ? "▶ 继续" : "❚❚ 暂停";
}
function setSpeed(v) {
  timeScale = v;
  paused = false;
  document.getElementById("btnPause").classList.remove("on");
  document.getElementById("btnPause").textContent = "❚❚ 暂停";
  document.querySelectorAll("[data-sp]").forEach((el) => {
    el.classList.toggle("on", Number(el.dataset.sp) === v);
  });
  speedEl.textContent = `${v.toFixed(1)}×`;
}

document.getElementById("btnPause").addEventListener("click", togglePause);
document.querySelectorAll("[data-sp]").forEach((el) => {
  el.addEventListener("click", () => {
    const v = Number(el.dataset.sp);
    if (v === 0) { clearFocus(); camState.targetYaw = -0.62; camState.targetPitch = 0.52; camState.targetRadius = 96; }
    else setSpeed(v);
  });
});

// ===========================================================================
// 8. Main loop
// ===========================================================================
const orbitLocal = (angle, r, out = new THREE.Vector3()) =>
  out.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);

const projected = new THREE.Vector3();

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const simDt = paused ? 0 : dt * timeScale;
  simTime += simDt;
  years += (simDt / 6.0) * (1 / 6); // purely cosmetic clock

  // ---- planets along orbits
  for (const b of bodies) {
    if (b.kind !== "planet") continue;
    b.angle += simDt * b.speed;
    orbitLocal(b.angle, b.dist, b.group.position);
    b.mesh.rotation.y += simDt * (0.9 + 6 / Math.abs(b.rotH)) * 0.6;
    if (b.mesh.children && b.mesh.children.length) { /* noop */ }
    // clouds rotate a touch faster
    const cl = b.group.children.find((o) => o.material && o.material.map && o.geometry.type === "SphereGeometry" && o !== b.mesh);
    if (cl) cl.rotation.y += simDt * 0.05;
    // selection ring lies in the orbital plane so it reads as a marker around the
    // body rather than a HUD circle pasted over the screen; it spins slowly
    if (b.selRing) {
      b.selRing.rotation.z += simDt * 0.7;
    }
    // moon: tidally locked, so one face always points at its planet
    if (b.moon) {
      b.moon.orbit.rotation.y += simDt * b.moon.speed;
      b.moon.mesh.rotation.y = -b.moon.orbit.rotation.y;
    }
  }

  // ---- sun animation
  sunMesh.rotation.y += simDt * 0.055;
  const pulse = 1 + Math.sin(simTime * 1.7) * 0.022;
  coronaA.scale.setScalar(SUN_RADIUS * 3.4 * pulse);
  coronaB.scale.setScalar(SUN_RADIUS * 6.2 * (2 - pulse));
  coronaShell.scale.setScalar(1 + Math.sin(simTime * 2.3) * 0.03);
  sunMesh.material.color.setScalar(1);

  // ---- belts drift
  beltMarsJup.rotation.y += simDt * 0.020;
  beltKuiper.rotation.y += simDt * 0.004;

  // ---- hover raycast
  const prev = hovered;
  hovered = pickAt();
  if (hovered !== prev) {
    canvas.style.cursor = hovered ? "pointer" : "crosshair";
    if (prev) {
      if (prev.kind === "planet") prev.atmo.material.opacity = 0.22;
      if (prev.label) prev.label.style.opacity = "";
    }
    if (hovered) {
      if (hovered.kind === "planet") hovered.atmo.material.opacity = 0.75;
      if (hovered.label) hovered.label.style.opacity = "1";
    }
  }

  // ---- camera target follows the focused body
  if (focused) {
    focused.group.getWorldPosition(tmpV);
    camTargetGoal.copy(tmpV);
  } else {
    camTargetGoal.set(0, 0, 0);
  }
  camTarget.lerp(camTargetGoal, 0.10);

  camState.yaw += (camState.targetYaw - camState.yaw) * 0.07;
  camState.pitch += (camState.targetPitch - camState.pitch) * 0.07;
  camState.radius += (camState.targetRadius - camState.radius) * 0.055;

  const sp = Math.sin(camState.pitch) * camState.radius;
  camera.position.set(
    camTarget.x + Math.sin(camState.yaw) * sp,
    camTarget.y + Math.cos(camState.pitch) * camState.radius,
    camTarget.z + Math.cos(camState.yaw) * sp,
  );
  camera.lookAt(camTarget);

  // A weak fill riding just off the camera axis. Without it every body past
  // Mercury reads as a lit crescent on a pure-black disc, because the only
  // other light is the sun itself.
  camFill.position.copy(camera.position)
    .addScaledVector(camTarget.clone().sub(camera.position).normalize(), camState.radius * 0.15);
  camFill.position.y += camState.radius * 0.10;

  // ---- labels
  // Labels are anchored up-and-right of their body rather than centred on it, so
  // the planet stays visible and neighbouring labels stop stacking on top of one
  // another in the crowded inner system.
  const labelSlots = [];
  for (const b of bodies) {
    if (!b.label) continue;
    b.group.getWorldPosition(tmpV);
    projected.copy(tmpV).project(camera);
    const behind = projected.z > 1;
    const x = (projected.x * 0.5 + 0.5) * innerWidth;
    const y = (-projected.y * 0.5 + 0.5) * innerHeight;
    if (behind || Math.abs(projected.x) > 1.1 || Math.abs(projected.y) > 1.1) {
      b.label.style.display = "none";
      continue;
    }
    // push each label up and to the right by its own radius on screen so it
    // clears the disc instead of sitting on top of it
    const worldR = b.dispR || 1;
    const edge = worldR * innerHeight / (2 * Math.tan((camera.fov * Math.PI) / 360) * Math.max(camera.position.distanceTo(tmpV), 0.001));
    const lx = x + Math.min(edge * 0.92 + 10, 120);
    let ly = y - Math.min(edge * 0.72 + 10, 70);
    // simple de-overlap against labels already placed this frame
    for (const s of labelSlots) {
      if (Math.abs(s.x - lx) < 120 && Math.abs(s.y - ly) < 22) ly = s.y - 24;
    }
    labelSlots.push({ x: lx, y: ly });
    b.label.style.display = "";
    b.label.style.transform = `translate(${lx}px, ${ly}px)`;
  }

  // ---- HUD
  fpsFrames++; fpsAcc += dt;
  if (fpsAcc > 0.5) {
    fpsEl.textContent = String(Math.round(fpsFrames / fpsAcc));
    fpsAcc = 0; fpsFrames = 0;
  }
  clockEl.textContent = `T+ ${years.toFixed(2)} YR`;

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false);
});

// ===========================================================================
// 9. Debug / verification hook
// ===========================================================================
window.__SOLAR__ = {
  scene, camera, renderer, bodies, THREE,
  camState,
  get hovered() { return hovered ? hovered.index : null; },
  get hoveredKey() { return hovered ? (hovered.kind === "sun" ? "sun" : hovered.index) : null; },
  get focused() { return focused ? (focused.kind === "sun" ? "sun" : focused.index) : null; },
  get timeScale() { return timeScale; },
  get paused() { return paused; },
  get lastClick() { return lastClick; },
  // what the raycaster sees for the pointer position right now
  debugPick() {
    const b = pickAt();
    return b ? (b.kind === "sun" ? "sun" : b.index) : null;
  },
  // camera is only "settled" once the dolly has stopped moving
  settled() {
    return Math.abs(camState.radius - camState.targetRadius) < 0.05
      && Math.abs(camState.yaw - camState.targetYaw) < 0.002
      && Math.abs(camState.pitch - camState.targetPitch) < 0.002;
  },
  select(i) {
    const b = i === "sun" ? bodies.find((x) => x.kind === "sun") : bodies.find((x) => x.kind === "planet" && x.index === i);
    if (b) selectBody(b);
    return !!b;
  },
  clear() { clearFocus(); },
  setSpeed,
  screenOf(i) {
    const b = i === "sun" ? bodies.find((x) => x.kind === "sun") : bodies.find((x) => x.kind === "planet" && x.index === i);
    if (!b) return null;
    b.group.getWorldPosition(tmpV);
    tmpV.project(camera);
    return { x: (tmpV.x * 0.5 + 0.5) * innerWidth, y: (-tmpV.y * 0.5 + 0.5) * innerHeight };
  },
  labelText() { return infoEl.classList.contains("on") ? infoEl.querySelector(".cn").textContent : null; },
};

// go
requestAnimationFrame(() => {
  document.getElementById("loading").classList.add("gone");
  tick();
});
</script>
</body>
</html>
